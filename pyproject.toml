[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elli-eebus-proxy"
version = "0.1.0.dev0"
description = "EEBUS proxy between energy managers (HEMS) and an Elli wallbox, working around its firmware bugs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Frane Bandov" }]
requires-python = ">=3.11"
dependencies = ["elli-eebus@https://github.com/frane/elli-eebus/archive/beec826627ea930727266d0edb92951d63ac7c7c.zip"]
keywords = ["elli", "wallbox", "eebus", "hems", "proxy", "solar-manager", "home-assistant"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://github.com/frane/elli-eebus-proxy"
Issues = "https://github.com/frane/elli-eebus-proxy/issues"

[project.scripts]
elli-eebus-proxy = "elliproxy.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/elliproxy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
